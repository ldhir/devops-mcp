# Settings for the MCP server and the alert runner.
# Secrets (OPENAI_API_KEY, SLACK_BOT_TOKEN) stay in .env, never here.

model:
  provider: openai        # only "openai" is implemented so far
  name: gpt-5.4
  base_url: ""            # leave empty for api.openai.com
  max_steps: 24          # hard cap on tool calls per investigation
  review: "flag"         # second pass over the evidence before posting. "flag" adds a double-check
                         # warning when the cause fails a timing, mechanism or size test; "off" skips it

# USD per 1M tokens, from OpenAI's model pages on 2026-11-12. Update when
# prices or the model change; a model missing here is logged with cost null.
prices:
  gpt-5.4:      {input: 2.50, cached_input: 0.25,  output: 15.00}
  gpt-5.4-mini: {input: 0.75, cached_input: 0.075, output: 4.50}

sources:
  prometheus: http://127.0.0.1:9090
  loki: http://127.0.0.1:3100
  jenkins: http://127.0.0.1:8081   # login from JENKINS_USER / JENKINS_PASSWORD in .env (read-only user)

slack:
  channel: "#alerts"

runner:
  port: 8088
  dedupe_minutes: 30      # ignore repeat notifications for the same alert

audit_log: audit.jsonl

# Which service runs where. Hand-written for the lab; in a real deployment this is
# rewritten for their hosts (and later derived from Prometheus labels).
service_map:
  lab-host-1:
    description: Single lab VM. Everything runs in Docker on this host.
    services:
      nginx:
        role: Front door. Proxies all HTTP traffic to orders-api.
        depends_on: [orders-api]
        logs: '{service="nginx"}'
      orders-api:
        role: FastAPI app. Takes orders and writes them to MongoDB.
        depends_on: [mongodb, redis]
        logs: '{service="orders-api"}'
        metrics_job: orders-api
        deploy_job: deploy-orders-api        # Jenkins job that deploys it
        repo: orders-api1/orders-api         # Bitbucket workspace/repo
      mongodb:
        role: Database for orders-api. Database name "shop".
        data_disk: /mnt/mongo-data
        logs: '{service="mongodb"}'
        metrics_job: mongodb
      redis:
        role: Cache and runtime settings for orders-api.
        logs: '{service="redis"}'
      backup:
        role: Scheduled dump of the shop database. Writes to /mnt/mongo-data/backups and keeps only the latest dump.
        depends_on: [mongodb]
        logs: '{service="backup"}'
      loadgen:
        role: Synthetic traffic. Posts orders through nginx all day.
        logs: '{service="loadgen"}'
    disks:
      /: Root disk. Operating system and Docker.
      /mnt/mongo-data: Dedicated MongoDB data disk.

# For disk_usage_breakdown: what is known to live on each disk. "measured" entries have a
# size metric in bytes; "unmeasured_writers" are services that write there with no size metric.
disk_accounting:
  lab-host-1:
    /mnt/mongo-data:
      measured:
        - name: MongoDB databases (data and indexes)
          promql: 'mongodb_dbstats_totalSize{instance="lab-host-1"}'
          labels: [database]
        - name: MongoDB collections (data and indexes)
          promql: 'mongodb_collstats_storageStats_totalSize{instance="lab-host-1"}'
          labels: [database, collection]
          detail_only: true
      unmeasured_writers: [backup]
