global:
  scrape_interval: 15s
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {instance: lab-host-1}
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels: {instance: lab-host-1, service: mongodb}
  - job_name: orders-api
    static_configs:
      - targets: ["orders-api:8000"]
        labels: {instance: lab-host-1, service: orders-api}
