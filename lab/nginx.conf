# Re-resolve the app's address on every few requests. Without this nginx keeps the
# address it saw at startup, and a redeploy or restart of orders-api leaves it
# proxying to a dead IP.
resolver 127.0.0.11 valid=5s;

server {
    listen 80;
    location / {
        set $orders_api http://orders-api:8000;
        proxy_pass $orders_api;
        proxy_connect_timeout 2s;
    }
}
