server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    # A freshly started shipper reads every container's log from the beginning. Drop old
    # lines so a restart (or an eval reset) cannot replay history into Loki. Lab choice:
    # it also means lines are lost if Loki is down for longer than this.
    pipeline_stages:
      - drop:
          older_than: 5m
          drop_counter_reason: older_than_5m
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
