# Lab: a small copy of a typical EC2-based stack.
# Everything listens on 127.0.0.1 only; reach it from a laptop through SSH.
services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - /mnt/mongo-data:/data/db        # its own small 2 GB disk, so "disk full" is contained
    ports: ["127.0.0.1:27017:27017"]
    restart: unless-stopped

  redis:
    image: redis:7.4
    restart: unless-stopped

  orders-api:
    image: lab-orders-api:current      # Jenkins rebuilds this tag on every deploy
    build: ./app
    environment:
      MONGO_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
    depends_on: [mongodb, redis]
    restart: unless-stopped

  backup:
    build: ./app
    command: ["python", "backup.py"]
    volumes:
      - /mnt/mongo-data:/data
    depends_on: [mongodb]
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8080:80"]
    depends_on: [orders-api]
    restart: unless-stopped

  loadgen:
    build: ./app
    command: ["python", "loadgen.py"]
    environment:
      TARGET: http://nginx
    depends_on: [nginx]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43
    command:
      - --mongodb.uri=mongodb://mongodb:27017
      - --collect-all
      - --discovering-mode
    depends_on: [mongodb]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki]
    restart: unless-stopped

  jenkins:
    build: ./jenkins
    user: root
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JENKINS_AGENT_PASSWORD: ${JENKINS_AGENT_PASSWORD}
      BITBUCKET_TOKEN: ${BITBUCKET_TOKEN:-unset}
    volumes:
      - ./jenkins/jenkins.yaml:/var/jenkins_casc/jenkins.yaml:ro
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/lab:/home/ubuntu/lab      # same path as the host, so compose resolves files identically
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped

volumes:
  jenkins-home:
  prometheus-data:
  loki-data:
  grafana-data:
